plugins {
  id 'java'
}

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
project.ext.mainClassName = "io.github.jakeushida.shadowaliens.teavm.TeaVMBuilder"
eclipse.project.name = appName + "-teavm"

// This must be at least 11, and no higher than the JDK version this project is built with.
java.targetCompatibility = "11"
// This should probably be equal to targetCompatibility, above. This only affects the TeaVM module.
java.sourceCompatibility = "11"


dependencies {
  implementation "com.github.xpenatan.gdx-teavm:backend-web:$gdxTeaVMVersion"
  implementation project(':core')

}

tasks.register("runRelease", JavaExec) {
  description = "Run the TeaVM application hosted via a local Jetty server at http://localhost:8080/"
  group("application")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
  args += ["run"]
}

tasks.register("runDebug", JavaExec) {
  description = "Run the TeaVM application with debug enabled hosted via a local Jetty server at http://localhost:8080/"
  group("application")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
  args += ["debug", "run"]
}

tasks.register("buildRelease", JavaExec) {
  description = "Build the TeaVM application; doesn't run directly"
  group("build")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
}

tasks.register("buildDebug", JavaExec) {
  description = "Build the TeaVM application with debug enabled; doesn't run directly"
  group("build")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
  args += ["debug"]
}

// The TeaVM backend regenerates index.html on every build and offers no template
// hook, so the generated page is decorated afterwards instead.
tasks.register("decorateWebapp") {
  description = "Adds sharing meta tags and a keyboard-required notice to the generated index.html"
  group("build")
  doLast {
    File index = file("build/dist/webapp/index.html")
    if (!index.exists()) {
      throw new GradleException("build/dist/webapp/index.html not found; run buildRelease first")
    }
    String html = index.getText("UTF-8")
    if (html.contains('id="keyboard-note"')) {
      return // already decorated
    }

    String head = '''
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="description" content="Shadow Aliens - a retro space shooter. Needs a keyboard.">
        <meta property="og:title" content="Shadow Aliens">
        <meta property="og:description" content="A retro space shooter. Needs a keyboard.">
        <meta property="og:type" content="website">
        <style>
            /* Phones and tablets only: laptops with touchscreens still report
               hover:hover, so they keep the plain game view. */
            #keyboard-note { display: none; }
            @media (hover: none) and (pointer: coarse) {
                #keyboard-note {
                    display: block;
                    position: fixed;
                    top: 0; left: 0; right: 0;
                    z-index: 10;
                    padding: 12px 16px;
                    background: #ffd34d;
                    color: #1a1a1a;
                    font: 600 14px/1.4 system-ui, -apple-system, sans-serif;
                    text-align: center;
                }
            }
        </style>
'''
    String body = '''        <div id="keyboard-note">Shadow Aliens is played with a keyboard &mdash; open this page on a desktop or laptop.</div>
'''

    html = html.replace('</head>', head + '    </head>')
    html = html.replace('<body oncontextmenu="return false">', '<body oncontextmenu="return false">\n' + body)
    index.setText(html, "UTF-8")
    logger.lifecycle("Decorated ${index}")
  }
}
buildRelease.finalizedBy decorateWebapp

// For backwards compatibility with the earlier run and build tasks.
tasks.register("run"){
  dependsOn runRelease
}
build.dependsOn buildRelease
